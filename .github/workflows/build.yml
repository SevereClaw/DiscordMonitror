name: Build Music-Discord

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # история и теги — для списка «что нового»

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Check the code compiles
        run: python -m py_compile vlc_discord.py updater.py

      - name: Updater self-test (replaces files like a real update)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_updater.py start
          python tests/test_updater.py check

      - name: Video links (Firefox tabs + YouTube)
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_video_links.py

      - name: YouTube Music search (real requests)
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_ytmusic.py

      - name: Stamp build number (for auto-update)
        shell: pwsh
        run: Set-Content -Path build_info.py -Value "BUILD = ${{ github.run_number }}" -Encoding ascii

      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --noconsole
          --name Music-Discord --icon icon.ico --add-data "icon.ico;."
          --collect-all winrt
          --hidden-import winrt.windows.media.control
          --hidden-import pystray._win32
          --hidden-import winrt.windows.foundation
          --hidden-import winrt.windows.foundation.collections
          --hidden-import winrt.windows.storage.streams
          --hidden-import winrt.windows.security.cryptography
          --hidden-import updater --hidden-import build_info --hidden-import lz4.block
          --log-level WARN
          vlc_discord.py

      - name: Smoke test - the exe starts and keeps running
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Music-Discord.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "Music-Discord.exe closed by itself (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "OK: Music-Discord.exe runs"

      - uses: actions/upload-artifact@v4
        with:
          name: Music-Discord
          path: dist/Music-Discord.exe

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8     # русские описания коммитов
          $tag = "build-${{ github.run_number }}"
          $prev = gh release view --json tagName -q .tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $prev) { $log = git log "$prev..HEAD" --no-merges --pretty=format:%s }
          else { $log = git log -1 --pretty=format:%s }
          $items = @($log | Where-Object { $_ -and $_ -notmatch '^(Тест|тест|Test|test|CI|ci|Merge|WIP)' } | Select-Object -Unique | ForEach-Object { "- $_" })
          if ($items.Count -eq 0) { $items = @("- Мелкие исправления") }
          $notes = ($items -join "`n") + "`n`nСкачай Music-Discord.exe и запусти."
          $notes | Out-File notes.md -Encoding utf8
          gh release create $tag dist\Music-Discord.exe --title "Music → Discord — сборка ${{ github.run_number }}" --notes-file notes.md --latest
